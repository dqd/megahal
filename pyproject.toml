[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megahal3"
dynamic = ["version"]
description = "Python 3 implementation of MegaHAL, the Markov chain chatbot"
readme = "README.md"
license = "WTFPL AND BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "dqd", email = "id@dqd.cz" },
]
requires-python = ">=3.8"
dependencies = []
keywords = ["megahal", "chatbot", "markov", "markov chain", "conversation simulator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/dqd/megahal"
Repository = "https://github.com/dqd/megahal"
Issues = "https://github.com/dqd/megahal/issues"

[project.scripts]
megahal = "megahal:main"

[tool.setuptools]
py-modules = ["megahal"]

[tool.setuptools.dynamic]
version = { attr = "megahal.__version__" }

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
